<style>
:root{
  --paper:#F7F5F0; --ink:#1A1F1A; --leaf:#5C7A4A; --seal:#B8442E;

  }
}
:root[data-theme="dark"]{
  --paper:#14170F; --ink:#E8E6DC; --leaf:#8FAF76; --seal:#E07A5F;
  --faded:#8F8B7C; --rule:#2E3327; --panel:#1B1F16; --grid:#262B1F;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Source Sans 3",system-ui,sans-serif; font-size:16px; line-height:1.65;
}
.wrap{max-width:940px; margin:0 auto; padding:56px 24px 96px}
h1{
  font-family:Bitter,Georgia,serif; font-weight:700; font-size:clamp(30px,5.2vw,46px);
  line-height:1.12; margin:0 0 14px; text-wrap:balance; letter-spacing:-.015em;
}
.sub{font-size:17px; color:var(--faded); max-width:62ch; margin:0 0 8px}
.meta{

  letter-spacing:.06em; text-transform:uppercase; margin-top:26px;
  padding-top:14px; border-top:2px solid var(--ink);

}
.meta b{color:var(--ink); font-weight:600}
figure{margin:0; background:var(--panel); border:1px solid var(--rule); padding:26px 24px 22px}
.figs{display:flex; flex-direction:column; gap:34px; margin-top:52px}
figcaption{margin:0 0 4px}
.fnum{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--seal);
  letter-spacing:.14em; font-weight:600;
}
.ftitle{
  font-family:Bitter,Georgia,serif; font-weight:700; font-size:20px;

}

}
.take b{color:var(--leaf)}
table{border-collapse:collapse; width:100%; font-size:14px}

.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
svg{display:block; max-width:100%; height:auto}
/* 散布図と地域名つきの棒は、幅が狭いとラベルが潰れて読めない。

@media (max-width:640px){
  .scroll.wide svg{max-width:none; width:660px}
  .scroll.wide{
    margin-inline:-24px; padding-inline:24px;
    scroll-snap-type:x proximity;
  }
  .scroll.wide::after{content:""; display:block}

.vnum{fill:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:11px; font-variant-numeric:tabular-nums}

  margin-top:60px; padding-top:20px; border-top:1px solid var(--rule);

</head><body>

<div class="wrap">
<h1>道端に何が映っているか</h1>
<p class="sub">世界の陸地からランダムに引いた車載写真 10,001 枚を1枚ずつ見て、識別できる植物にタグを付けた。分布図ではなく、<b>実際に道から見える確率</b>の記録である。</p>
<div class="meta">
  <span>判定 <b>10,001</b> 枚</span>
  <span>植物あり <b>2,973</b> 枚</span>
  <span>タグ <b>53</b> 種</span>
  <span>出典 <b>Mapillary</b> CC BY-SA</span>
</div>

<div class="figs">

<figure>
<figcaption>
  <div class="fnum">図 1 — 緯度</div>
  <div class="ftitle">高緯度ほど植物が読める</div>
  <p class="fdesc">緯度10度ごとに、識別できる植物が1つ以上写っていた割合。朱色は50%を超えた帯。</p>
</figcaption>

<p class="take"><b>北緯60度台が71%で突出する。</b>針葉樹林帯は樹種が少なく、トウヒとカバノキとマツしか生えていないため、遠景のシルエットでも属が確定する。逆に北緯20度台（18%）と40度台（22%）が低い。乾燥帯の低木と、温帯の落葉混交林は、どちらも「木はあるが属が分からない」の典型である。</p>

<p class="take"><b>右上が空いている。</b>これは偶然ではなく、頻出する分類群ほど分布が広いという構造による。マツ属は685枚と最多だが46地域に散らばり、最頻地域を当てても19%しか当たらない。逆にヨモギ属はわずか16枚だが、そのうち75%が米国北西部である。<b>覚える価値があるのは左上の希少種</b>で、右下の常連は「見えても情報がない」。</p>
